    /* -------------------------------------------------- components */
    function Reveal({ delay = 0, className = '', children }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); io.disconnect(); }
        }, { threshold: 0.15 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return html`
        <div
          ref=${ref}
          className=${'transition-all duration-700 ease-out will-change-transform ' + className}
          style=${{ transitionDelay: delay + 'ms', opacity: visible ? 1 : 0, transform: visible ? 'translateY(0)' : 'translateY(26px)' }}
        >${children}</div>
      `;
    }

    const EcgLine = () => html`
      <svg viewBox="0 0 340 56" fill="none" aria-hidden="true"
           className="mx-auto mt-9 h-12 w-full max-w-md">
        <path
          d="M2 30 H126 l9 -1 8 -13 10 27 8 -33 9 20 6 0 H196 l6 0 7 -9 9 19 7 -15 5 5 H338"
          stroke="#4ade80" strokeWidth="2.6"
          strokeLinecap="round" strokeLinejoin="round"
          className="ecg-path"
          style=${{ filter: 'drop-shadow(0 0 7px rgba(74,222,128,.65))' }}
        />
        <circle cx="126" cy="30" r="3.6" fill="#4ade80" className="ecg-dot" />
      </svg>
    `;

    const ServiceCard = ({ icon: Icon, title, delay }) => html`
      <${Reveal} delay=${delay} className="h-full">
        <div className="group flex h-full items-center justify-between gap-4 rounded-2xl bg-gradient-to-bl from-brand-steel to-brand-navy p-4 pl-5 text-white shadow-lg shadow-brand-navy/15 ring-1 ring-white/10 transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl hover:shadow-green-500/20 hover:ring-green-400/60 md:p-5">
          <h3 className="text-base font-bold leading-7 md:text-lg">${title}</h3>
          <span className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-green-500/15 text-green-400 ring-1 ring-green-400/40 transition-all duration-300 group-hover:bg-green-500 group-hover:text-white group-hover:shadow-[0_0_18px_rgba(34,197,94,0.55)]">
            <${Icon} size=${22} strokeWidth=${2.2} />
          </span>
        </div>
      </${Reveal}>
    `;

    const PhoneCard = ({ icon: Icon, label, number, tel }) => html`
      <a
        href=${'tel:' + tel}
        className="group flex items-center justify-between gap-3 rounded-2xl bg-slate-50 px-4 py-3 ring-1 ring-slate-200/90 transition-all duration-300 hover:bg-green-50 hover:shadow-md hover:shadow-green-500/10 hover:ring-green-400/60"
      >
        <span>
          <span className="block text-xs font-medium text-slate-500">${label}</span>
          <span dir="ltr" className="mt-0.5 block text-xl font-extrabold tracking-wider text-brand-navy transition-colors group-hover:text-green-600">
            ${number}
          </span>
        </span>
        <span className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-green-100 text-brand-navy transition-colors duration-300 group-hover:bg-green-500 group-hover:text-white">
          <${Icon} size=${21} />
        </span>
      </a>
    `;

    /* -------------------------------------------------------- app */
    function App() {
      return html`
        <div className="min-h-screen bg-white font-vazir text-slate-800 antialiased">

          <!-- ══════════════════ HERO ══════════════════ -->
          <header className="relative overflow-hidden rounded-b-[2.5rem] bg-[linear-gradient(165deg,#3ba7cf_0%,#2878ab_35%,#1c578a_68%,#194470_100%)] px-4 pb-16 pt-12 shadow-xl shadow-brand-navy/20 md:rounded-b-[3.5rem] md:pb-24 md:pt-16">
            <!-- decorative circuit accents -->
            <div className="pointer-events-none absolute inset-0" aria-hidden="true">
              <div className="absolute -top-28 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-white/10 blur-3xl"></div>
              <div className="absolute -bottom-24 -left-16 h-64 w-64 rounded-full bg-green-400/10 blur-3xl"></div>
              <span className="absolute right-[6%] top-24 select-none text-3xl font-light text-white/15">+</span>
              <span className="absolute left-[8%] top-44 select-none text-2xl font-light text-white/15">+</span>
              <span className="absolute right-[12%] bottom-24 h-2 w-2 rounded-full bg-green-400/40"></span>
              <span className="absolute left-[15%] bottom-44 h-1.5 w-1.5 rounded-full bg-sky-300/40"></span>
              <span className="absolute left-[24%] top-28 h-1.5 w-1.5 rounded-full bg-sky-300/25"></span>
            </div>

            <div className="relative mx-auto max-w-3xl text-center">
              <!-- logo -->
              <div className="fade-up relative mx-auto mt-2 h-40 w-40 md:h-48 md:w-48">
                <div className="logo-glow absolute -inset-10 rounded-full bg-green-400/25 blur-3xl"></div>
                <div className="absolute -inset-3 animate-spin-slow rounded-full border-2 border-dashed border-white/25"></div>
                <div className="relative h-full w-full rounded-full bg-white p-2.5 shadow-2xl ring-1 ring-white/50">
                  <img src=${LOGO_SRC} alt="لوگوی طب کار آسان" className="h-full w-full rounded-full object-cover" />
                </div>
              </div>

              <!-- headline -->
              <h1 className="fade-up mt-9 font-titr text-5xl text-white drop-shadow-[0_4px_18px_rgba(10,40,70,0.45)] sm:text-6xl md:text-7xl lg:text-8xl" style=${{ animationDelay: '200ms' }}>
                طب کار آسان
              </h1>
              <div className="fade-up mt-5 text-[11px] font-bold uppercase tracking-[0.35em] text-sky-200/70 md:text-xs" style=${{ animationDelay: '300ms' }}>
                ASAN OCCUPATIONAL MEDICINE
              </div>
              <p className="fade-up mt-4 text-lg font-semibold text-sky-100 md:text-2xl" style=${{ animationDelay: '400ms' }}>
                معاینات شغلی و بیماری‌های شغلی
              </p>

              <${EcgLine} />
            </div>
          </header>

          <!-- ══════════════════ SERVICES ══════════════════ -->
          <main className="bg-gradient-to-b from-[#eaf4fb] via-white to-white">
            <section className="mx-auto max-w-5xl px-4 pb-4 pt-14 md:pt-20">
              <${Reveal}>
                <h2 className="text-center text-3xl font-black text-brand-navy md:text-4xl">خدمات ما</h2>
                <div className="mx-auto mt-3 h-1.5 w-16 rounded-full bg-gradient-to-l from-green-400 to-green-600"></div>
              </${Reveal}>

              <${Reveal}>
                <div className="mx-auto mt-6 flex max-w-3xl flex-col items-center gap-4 rounded-2xl bg-green-50 px-6 py-5 text-center ring-1 ring-green-500/20 sm:flex-row sm:text-right">
                  <span className="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-green-500 text-white shadow-md shadow-green-500/30">
                    <${UserCheck} size=${24} />
                  </span>
                  <p className="text-[15px] font-semibold leading-8 text-brand-navy md:text-lg md:leading-9">
                    ما پذیرای مراجعین گرامی و همچنین معاینات دوره‌ای سلامت شغلی کارخانه‌ها، کارگاه‌ها و ادارات هستیم.
                  </p>
                </div>
              </${Reveal}>

              <div className="mt-10 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 md:gap-5">
                ${SERVICES.map((s, i) => html`
                  <${ServiceCard} key=${s.title} icon=${s.icon} title=${s.title} delay=${(i % 3) * 90} />
                `)}
              </div>
            </section>

            <!-- ══════════════════ CONTACT ══════════════════ -->
            <section className="mx-auto max-w-4xl px-4 pb-16 pt-8 md:pb-24">
              <${Reveal}>
                <div className="rounded-[2rem] bg-white p-6 shadow-[0_20px_60px_-15px_rgba(25,68,112,0.28)] ring-1 ring-slate-200 md:p-9">
                  <div className="flex items-center gap-3">
                    <span className="grid h-11 w-11 place-items-center rounded-xl bg-brand-navy text-white shadow-md shadow-brand-navy/30">
                      <${MapPin} size=${22} />
                    </span>
                    <h2 className="text-xl font-extrabold text-brand-navy md:text-2xl">نشانی</h2>
                  </div>

                  <a
                    href=${MAPS_URL}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="mt-4 block rounded-xl text-[15px] font-medium leading-8 text-slate-600 transition-colors hover:text-brand-navy md:text-base md:leading-9"
                  >
                    ${ADDRESS}
                  </a>

                  <div className="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2">
                    ${PHONES.map((p) => html`
                      <${PhoneCard} key=${p.tel} icon=${p.icon} label=${p.label} number=${p.number} tel=${p.tel} />
                    `)}
                  </div>
                </div>
              </${Reveal}>
            </section>
          </main>

          <!-- ══════════════════ FOOTER ══════════════════ -->
          <footer>
            <div className="h-[3px] bg-gradient-to-l from-green-600 via-green-400 to-green-600"></div>
            <div className="bg-brand-navy-deep px-4 py-6 md:py-7">
              <div className="mx-auto flex max-w-5xl flex-col items-center justify-between gap-2 sm:flex-row">
                <p className="text-lg font-black text-white">طب کار آسان</p>
                <p className="text-sm font-bold text-green-400 md:text-base">سلامت کارگران، آرامش کارفرمایان</p>
              </div>
            </div>
          </footer>
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
